name: daily-pool
on:
  schedule:
    - cron: "40 7 * * 1-5"   # 15:40 北京时间(UTC+8) 收盘后: 增量补当日K -> 筛选 -> 推云端
  workflow_dispatch: {}
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 增量更新+筛选+推送云端
        env:
          WORKER_URL: https://webmon.wxatp.workers.dev
          AUTH_TOKEN: *** secrets.WORKER_AUTH_TOKEN }}
        run: python cf_worker/cloud_screen.py update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool
          path: pool.json
          retention-days: 30
